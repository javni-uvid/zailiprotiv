[project]
name = "zailiprotiv"
version = "0.1.0"
description = "Laws passed by Serbia's National Assembly, their effects as their proposers state them, and how every MP voted"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Roll calls are read with poppler's pdftotext (poppler-utils), which keeps a PDF's columns apart.
dependencies = ["jinja2>=3.1"]

[project.scripts]
zailiprotiv = "zailiprotiv.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zailiprotiv"]
artifacts = ["src/zailiprotiv/templates/*", "src/zailiprotiv/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
