[project]
name = "zailiprotiv"
version = "0.1.0"
description = "Laws passed by Serbia's National Assembly, their effects as their proposers state them, and how every MP voted"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pypdf>=5",
]

[project.scripts]
zailiprotiv = "zailiprotiv.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zailiprotiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
