# zizmor (the workflows' security check, security.yml). These workflows commit and push what they read or wrote,
# so their checkout keeps the token on purpose.
rules:
  artipacked:
    ignore:
      - fixtures.yml
      - mp-years.yml
      - notes.yml
      - osnova.yml
      - sample.yml
      - snimci.yml
      - summaries.yml
      - transcripts.yml
      - votes.yml
