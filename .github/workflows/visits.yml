# By hand: what Cloudflare Web Analytics counted on the site (pages, where visitors came from, devices, hours), and if
# asked, what Cloudflare stopped on the way (tools/blocked.py).
# Sums only, and no row seen fewer than three times: this log is public. Reads only.
name: visits

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back"
        default: "24"
      search:
        description: "Also Google Search: the searches the site came up for (needs the secret GSC_KEY)"
        type: boolean
        default: false
      inspect:
        description: "With search: whether Google indexed the pages, this many of each kind in each script (0: not asked; 8 is some 190 of the 2,000 a day)"
        default: "0"
      blocked:
        description: "Also what Cloudflare stopped (security events; how search engines' crawlers fared)"
        type: boolean
        default: false

permissions: {}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # URL Inspection takes some 5 s an address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
        run: python3 tools/visits.py "$HOURS"
      # Each reading stands on its own: one that fails (a key not set right, 20 Nov 2026) does not stop the others.
      - name: How fast the pages are (Core Web Vitals)
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
        run: python3 tools/vitals.py "$HOURS"
      - name: How long the live page is in view
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
        run: python3 tools/watching.py "$HOURS"
      - name: What Google Search showed
        if: ${{ !cancelled() && inputs.search }}
        env:
          GSC_KEY: ${{ secrets.GSC_KEY }}
          HOURS: ${{ inputs.hours }}
          IN_INSPECT: ${{ inputs.inspect }}
        run: |
          pip install -q google-auth==2.62.2 requests==2.34.2
          case "$IN_INSPECT" in ''|*[!0-9]*) n=0 ;; *) n="$IN_INSPECT" ;; esac  # a number, or nothing asked
          python3 tools/search.py $(( (HOURS + 23) / 24 < 7 ? 7 : (HOURS + 23) / 24 )) --inspect "$n"
      - name: What was stopped
        if: ${{ !cancelled() && inputs.blocked }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOURS: ${{ inputs.hours }}
        run: python3 tools/blocked.py "$HOURS"
