# By hand: what Cloudflare Web Analytics counted on the site (pages, where visitors came from, devices, hours), and if
# asked, what Cloudflare stopped on the way (tools/blocked.py).
# Sums only, and no row seen fewer than three times: this log is public. Reads only.
name: visits

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back"
        default: "24"
      search:
        description: "Also Google Search: the searches the site came up for (needs the secret GSC_KEY)"
        type: boolean
        default: false
      blocked:
        description: "Also what Cloudflare stopped (security events; how search engines' crawlers fared)"
        type: boolean
        default: false

permissions: {}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
        run: python3 tools/visits.py "$HOURS"
      - name: How long the live page is in view
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
        run: python3 tools/watching.py "$HOURS"
      - name: What Google Search showed
        if: inputs.search
        env:
          GSC_KEY: ${{ secrets.GSC_KEY }}
          HOURS: ${{ inputs.hours }}
        run: |
          pip install -q google-auth requests
          python3 tools/search.py $(( (HOURS + 23) / 24 < 7 ? 7 : (HOURS + 23) / 24 ))
      - name: What was stopped
        if: inputs.blocked
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOURS: ${{ inputs.hours }}
        run: python3 tools/blocked.py "$HOURS"
