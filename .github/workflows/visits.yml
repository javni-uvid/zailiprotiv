# By hand: what Cloudflare Web Analytics counted on the site (pages, where visitors came from, devices, hours).
# Sums only, and no row seen fewer than three times: this log is public. Reads only.
name: visits

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back"
        default: "24"

permissions: {}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
        run: python3 tools/visits.py "$HOURS"
