# By hand: what do these public pages of the site say right now? Their text, without markup, for checking what is
# live from where the site cannot be reached. Reads only.
name: peek

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Addresses, space-separated"
        required: true
      chars:
        description: "How much of each page's text"
        default: "6000"
      raw:
        description: "The page's HTML as it is, not its text (as much as chars)"
        type: boolean
        default: false

permissions: {}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read
        env:
          IN_URLS: ${{ inputs.urls }}
          IN_CHARS: ${{ inputs.chars }}
          IN_RAW: ${{ inputs.raw }}
        run: |
          for u in ${IN_URLS}; do
            echo "=== $u"
            curl -sS -L --max-time 60 -A "Mozilla/5.0 (zailiprotiv.rs peek)" "$u" -o page.html -w "%{http_code} %{size_download} bytes\n" || continue
            if [ "${IN_RAW}" = "true" ]; then sed 's/></>\n</g' page.html | head -c "${IN_CHARS}"; echo; continue; fi  # a line too long is lost from the log
            python3 - "${IN_CHARS}" <<'PY'
          import re, sys, html
          t = open("page.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"(?s)<(script|style|svg|nav|header|footer)\b.*?</\1>", " ", t)
          t = re.sub(r"(?s)<(h[1-4]|li|p|tr|section|div)\b[^>]*>", "\n", t)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t))
          t = "\n".join(l for l in (re.sub(r"\s+", " ", l).strip() for l in t.splitlines()) if l)
          print(t[:int(sys.argv[1])])
          # where video comes from: players, streams and links to them (the text above drops scripts and iframes)
          raw = open("page.html", encoding="utf-8", errors="replace").read()
          seen = set()
          for m in re.finditer(r'(?:src|href|data-src|file)\s*[=:]\s*["\']([^"\']+)', raw):
              u = html.unescape(m.group(1))
              if re.search(r"(?i)youtu|vimeo|video|stream|m3u8|mp4|live|prenos|uzivo|%D0%BF%D1%80%D0%B5%D0%BD|пренос|уживо|iframe|player", u) and u not in seen:
                  seen.add(u); print("link:", u)
          PY
          done
