# By hand: what do these public pages of the site say right now? Their text, without markup, for checking what is
# live from where the site cannot be reached. Reads only.
name: peek

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Addresses, space-separated"
        required: true
      chars:
        description: "How much of each page's text"
        default: "6000"

permissions: {}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read
        run: |
          for u in ${{ inputs.urls }}; do
            echo "=== $u"
            curl -sS -L --max-time 60 -A "Mozilla/5.0 (zailiprotiv.rs peek)" "$u" -o page.html -w "%{http_code} %{size_download} bytes\n" || continue
            python3 - "${{ inputs.chars }}" <<'PY'
          import re, sys, html
          t = open("page.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"(?s)<(script|style|svg|nav|header|footer)\b.*?</\1>", " ", t)
          t = re.sub(r"(?s)<(h[1-4]|li|p|tr|section|div)\b[^>]*>", "\n", t)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t))
          t = "\n".join(l for l in (re.sub(r"\s+", " ", l).strip() for l in t.splitlines()) if l)
          print(t[:int(sys.argv[1])])
          PY
          done
