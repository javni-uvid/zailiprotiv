# The model's writing, through the Message Batches API (half the price of single calls): summaries of the bills'
# memoranda, summaries of the debates on the laws with most votes against, and overviews of what MPs most often say.
# Runs after each transcripts run, every six hours to pick up batches still running (their ids are in
# data/batches.json), and by hand. Replies are checked (quotes word for word) before they are saved; a refused one is
# sent again once with what was wrong. Signs in with the repository's identity (no key stored), or with the
# repository secret ANTHROPIC_API_KEY if one is set.
name: summaries

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      convocation:
        description: "Only this convocation (empty: every one)"
        default: ""
      limit:
        description: "Summaries of memoranda: at most this many per convocation (0: all)"
        default: "0"
      wait:
        description: "Minutes to wait for the batches in all, before leaving them for the next run"
        default: "90"
      model:
        description: "Model for this run (empty: the default in summaries.py)"
        default: ""
      replace:
        description: "Write again what this model wrote (e.g. claude-haiku-5-5), with the model of this run; debates and MP overviews"
        default: ""
      kinds:
        description: "Which writing to do: summaries debates profiles (empty: all)"
        default: ""

permissions:
  contents: write
  id-token: write  # the repository's identity, exchanged for a short-lived Anthropic API token
  issues: write
  actions: write

concurrency:
  group: summaries
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # main as it is when the run starts, not as it was when the run was asked for: a run that waited behind
      # another would otherwise not see what that one wrote, and pay for the same writing again.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Write
        env:
          IN_MODEL: ${{ inputs.model }}
          IN_REPLACE: ${{ inputs.replace }}
          IN_KINDS_OR: ${{ inputs.kinds || 'summaries debates profiles' }}
          IN_WAIT_OR: ${{ inputs.wait || 90 }}
          IN_CONVOCATION: ${{ inputs.convocation }}
          IN_LIMIT_OR: ${{ inputs.limit || 0 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Signing in without a key (src/zailiprotiv/federated.py): the federation rule set up in the Anthropic
          # Console for this repository's main branch. These ids grant nothing by themselves.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01NCmgWJsGrXFudbCfhmGqvD
          ANTHROPIC_ORGANIZATION_ID: 7dd19a6e-f6b2-4240-a238-fa1268701199
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01B894Uyt46AtSiNR9igxMvJ
          ANTHROPIC_WORKSPACE_ID: wrkspc_01NNmkqCRfENePvimjwqYJtD
        run: |
          pip install uv && uv sync --frozen
          [ -n "${IN_MODEL}" ] && export ZAILIPROTIV_MODEL="${IN_MODEL}"
          [ -n "${IN_REPLACE}" ] && export ZAILIPROTIV_REPLACE="${IN_REPLACE}"
          kinds=" ${IN_KINDS_OR} "
          # Two passes: the first sends every batch without waiting, so they run side by side; the second waits for
          # them, all together at most the time given (what is left of it for each command).
          deadline=$(( $(date +%s) + ${IN_WAIT_OR} * 60 ))
          for pass in 1 2; do
            for c in $(ls data); do
              [ -f "data/$c/laws.json" ] || continue
              [ -n "${IN_CONVOCATION}" ] && [ "$c" != "${IN_CONVOCATION}" ] && continue
              wait=$(( pass == 1 ? 0 : ($deadline - $(date +%s)) / 60 )); [ "$wait" -lt 0 ] && wait=0
              case "$kinds" in *" summaries "*) uv run zailiprotiv --convocation "$c" summaries --batch --wait "$wait" --limit "${IN_LIMIT_OR}";; esac
              case "$kinds" in *" debates "*) uv run zailiprotiv --convocation "$c" debates-batch --wait "$wait";; esac
            done
            wait=$(( pass == 1 ? 0 : ($deadline - $(date +%s)) / 60 )); [ "$wait" -lt 0 ] && wait=0
            case "$kinds" in *" profiles "*) uv run zailiprotiv profiles-batch --wait "$wait";; esac
          done
          uv run zailiprotiv status
      - name: Commit
        if: always()  # keep what was written, and the ids of batches still running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Written by the model: summaries, debates, MP overviews"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          if git status -sb | grep -q ahead; then exit 1; fi
          gh workflow run pages.yml --ref main
      - name: Tell the maintainer when this failed
        if: failure()
        env:
          CTX_WORKFLOW: ${{ github.workflow }}
          CTX_SERVER_URL: ${{ github.server_url }}
          CTX_REPOSITORY: ${{ github.repository }}
          CTX_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue per workflow, not one per failed run.
          title="Workflow ${CTX_WORKFLOW} ne prolazi"
          url="${CTX_SERVER_URL}/${CTX_REPOSITORY}/actions/runs/${CTX_RUN_ID}"
          n=$(gh issue list -R "${CTX_REPOSITORY}" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${CTX_REPOSITORY}" --body "Ponovo: $url"
          else gh issue create -R "${CTX_REPOSITORY}" --title "$title" --body "Pokretanje nije prošlo: $url"; fi
