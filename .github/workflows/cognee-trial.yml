# By hand: cognee on one bill, with no LLM key (local GLiNER for the graph, a local multilingual model for
# embeddings), to see what it makes of our documents. The graph's page and data are kept as the run's artifact;
# nothing goes to the site and nothing is committed.
name: cognee-trial

on:
  workflow_dispatch:
    inputs:
      pdf:
        description: "The bill's PDF at the Assembly"
        default: "https://www.parlament.gov.rs/upload/archive/files/lat/pdf/predlozi_zakona/14_saziv/2148-25. - Lat..pdf"
      embedding:
        description: "fastembed model for the embeddings"
        default: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

permissions: {}

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TELEMETRY_DISABLED: "true"
      GRAPH_EXTRACTOR: gliner_demo
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: ${{ inputs.embedding }}
      EMBEDDING_DIMENSIONS: "384"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "cognee[gliner]==1.6.8" pypdf
          pip list 2>/dev/null | grep -i -E "^(cognee|gliner2|torch|fastembed) " || true
      - name: Fetch the bill
        env:
          PDF: ${{ inputs.pdf }}
        run: curl -sS -L --fail --max-time 120 -A "Mozilla/5.0 (zailiprotiv.rs)" -o zakon.pdf "${PDF// /%20}" && ls -l zakon.pdf  # the Assembly's file names hold spaces
      - name: Run
        run: python tools/cognee_trial.py zakon.pdf proba 2>&1 | grep -v -E "^\s*$" | tail -80
      # Also into the log, packed: the artifact's storage is not reachable from every place that reads the result.
      - name: Print
        if: always()
        run: |
          for f in proba/*; do echo "=== $f"; gzip -9 -c "$f" | base64 -w 3000; echo "=== end"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: cognee-proba
          path: proba/
          if-no-files-found: warn
