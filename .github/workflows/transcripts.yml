# After each votes run (or by hand): the stenographic notes of the debates on the laws with the most votes against, read into
# data/<convocation>/transcripts/<sitting>.json and committed.
name: transcripts

on:
  workflow_dispatch:
    inputs:
      convocation:
        description: "Convocation"
        type: choice
        options: ["15", "14", "13", "12", "11", "10", "9", "sve"]
        default: "14"
      top:
        description: "How many of the laws with the largest share of votes against"
        default: "20"
      again:
        description: "Read sittings already read again"
        type: boolean
        default: false
      all:
        description: "Every sitting, not only those of the contested laws; these notes are kept in the bucket, not in the repository"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: transcripts
  cancel-in-progress: false

jobs:
  transcripts:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Read the notes
        env:
          IN_CONVOCATION: ${{ inputs.convocation }}
          IN_ALL: ${{ inputs.all }}
          IN_AGAIN_FLAG: ${{ inputs.again && '--again' || '' }}
          IN_TOP: ${{ inputs.top }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui poppler-utils  # the older notes are .doc
          pip install uv && uv sync --frozen
          convs="${IN_CONVOCATION}"; [ "$convs" = "sve" ] && convs=$(ls -d data/[0-9]*/ | xargs -n1 basename | sort -rn | tr '\n' ' ')
          if [ "${IN_ALL}" = "true" ]; then
            # Every sitting: what the bucket already holds is brought first (so it is not read again), each
            # convocation gets what is left of five hours, and what was read is sent to the bucket whatever happens.
            uv run zailiprotiv notes-raw --pull --force
            deadline=$(( $(date +%s) + 300 * 60 ))
            for c in $convs; do
              left=$(( ($deadline - $(date +%s)) / 60 )); [ "$left" -lt 1 ] && break
              uv run zailiprotiv --convocation "$c" transcripts --all --minutes "$left" ${IN_AGAIN_FLAG} || true
              uv run zailiprotiv notes-raw --push
            done
          else
            for c in $convs; do
              uv run zailiprotiv --convocation "$c" transcripts --top "${IN_TOP}" ${IN_AGAIN_FLAG}
            done
          fi
      - name: Commit
        if: always()  # keep the sittings read even when a later one failed
        env:
          IN_ALL: ${{ inputs.all }}
          IN_CONVOCATION: ${{ inputs.convocation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Of every sitting's notes only those already in the repository are committed (the contested laws');
          # the rest live in the bucket.
          if [ "${IN_ALL}" = "true" ]; then git add -u data; else git add data; fi
          if ! git diff --cached --quiet; then
            git commit -m "Stenographic notes of the debates (convocation ${IN_CONVOCATION})"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            if git status -sb | grep -q ahead; then exit 1; fi
          fi
          # The model writes only from the notes in the repository, so a run over every sitting starts none.
          if [ "${IN_ALL}" != "true" ]; then
            for c in $(echo "${IN_CONVOCATION}" | sed "s/sve/$(ls -d data/[0-9]*/ | xargs -n1 basename | sort -rn | tr '\n' ' ')/"); do gh workflow run summaries.yml --ref main -f convocation=$c; done
          fi
          gh workflow run notes.yml --ref main || true  # the notes as pages of their own (R2)
      - name: Tell the maintainer when this failed
        if: failure()
        env:
          CTX_WORKFLOW: ${{ github.workflow }}
          CTX_SERVER_URL: ${{ github.server_url }}
          CTX_REPOSITORY: ${{ github.repository }}
          CTX_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue per workflow, not one per failed run.
          title="Workflow ${CTX_WORKFLOW} ne prolazi"
          url="${CTX_SERVER_URL}/${CTX_REPOSITORY}/actions/runs/${CTX_RUN_ID}"
          n=$(gh issue list -R "${CTX_REPOSITORY}" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${CTX_REPOSITORY}" --body "Ponovo: $url"
          else gh issue create -R "${CTX_REPOSITORY}" --title "$title" --body "Pokretanje nije prošlo: $url"; fi
