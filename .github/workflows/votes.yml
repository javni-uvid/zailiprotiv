# Every hour of the working day for the current convocation, or by hand for another: index a convocation's sittings
# (with the agenda of those convened) and laws, the bills in procedure, read every roll call and bill not read yet,
# link laws to their votes, and commit data/<convocation>/ when it changed. A scheduled run that finds nothing new
# stops there; one that does continues the chain (transcripts, the model's writing, the site).
name: votes

on:
  schedule:
    - cron: "17 5-21 * * *"  # every hour, 06:17 to 22:17 in Belgrade (winter)
  workflow_dispatch:
    inputs:
      convocation:
        description: "Convocation (14 is the current one; 13 and 12 are in the archive)"
        type: choice
        options: ["14", "13", "12", "11", "10", "9"]
        default: "14"
      scheduled:
        description: "Started by the clock (the counter's worker): when nothing new is found, the chain stops"
        type: boolean
        default: false
      again:
        description: "Read every roll call again, not only new ones"
        type: boolean
        default: false
      reread:
        description: "Read again the roll calls whose address contains this text"
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: votes
  cancel-in-progress: false

jobs:
  votes:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Index the sittings and read the roll calls
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install uv && uv sync --frozen
          c="--convocation ${{ inputs.convocation || '14' }}"
          uv run zailiprotiv $c index
          uv run zailiprotiv $c laws
          # The bills in procedure are the current convocation's only.
          if [ "${{ inputs.convocation || '14' }}" = "$(uv run python -c 'from zailiprotiv.config import CURRENT; print(CURRENT)')" ]; then uv run zailiprotiv $c procedure; uv run zailiprotiv photos || true; fi
          uv run zailiprotiv $c votes ${{ inputs.again && '--again' || '' }} --reread "${{ inputs.reread }}"
          uv run zailiprotiv $c link
          uv run zailiprotiv $c bills
      - name: Commit
        if: always()  # keep what was read even when a later step failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          c="${{ inputs.convocation || '14' }}"
          # Next in the chain: the notes of the debates, then the model's writing, which publishes the site.
          if ! git diff --cached -I'"fetched": "[^"]*"' | grep -q '^@@'; then
            # Nothing new but the time of reading: no commit. An hourly run stops here; one by hand goes on.
            [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.scheduled }}" = "true" ] && exit 0
            gh workflow run transcripts.yml --ref main -f convocation=$c; exit 0
          fi
          git commit -m "Roll calls read from the Assembly's site (convocation ${{ inputs.convocation || '14' }})"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          if git status -sb | grep -q ahead; then exit 1; fi
          gh workflow run pages.yml --ref main
          gh workflow run transcripts.yml --ref main -f convocation=$c
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tell the maintainer when this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue per workflow, not one per failed run.
          title="Workflow ${{ github.workflow }} ne prolazi"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${{ github.repository }}" --body "Ponovo: $url"
          else gh issue create -R "${{ github.repository }}" --title "$title" --body "Pokretanje nije prošlo: $url"; fi
