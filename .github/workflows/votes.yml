# Every hour of the working day for the current convocation, or by hand for another: index a convocation's sittings
# (with the agenda of those convened) and laws, the bills in procedure, read every roll call and bill not read yet,
# link laws to their votes, and commit data/<convocation>/ when it changed. A scheduled run that finds nothing new
# stops there; one that does continues the chain (transcripts, the model's writing, the site). The recordings are
# placed by snimci, which this starts.
name: votes

on:
  schedule:
    - cron: "17 5-21 * * *"  # every hour, 06:17 to 22:17 in Belgrade (winter)
  workflow_dispatch:
    inputs:
      convocation:
        description: "Convocation (\"tekući\" is config.CURRENT, the one the hourly runs read)"
        type: choice
        options: ["tekući", "15", "14", "13", "12", "11", "10", "9"]
        default: "tekući"
      scheduled:
        description: "Started by the clock (the counter's worker): when nothing new is found, the chain stops"
        type: boolean
        default: false
      again:
        description: "Read every roll call again, not only new ones"
        type: boolean
        default: false
      reread:
        description: "Read again the roll calls whose address contains this text"
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: votes
  cancel-in-progress: false

jobs:
  votes:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The branch as it is when the run begins, not when it was asked for: a run that waited behind another read the
      # state before that one's commit and lost its own to the conflict (24 Nov 2026, 20:47 UTC: an hour's reading).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # When the Assembly sits next is what the live page tells its readers, so the newest convocation's sittings are
      # read first and published at once when anything in them is new (25 Nov 2026): the rest of a run on a sitting's
      # evening takes over an hour (the recordings), and its commit comes at the end.
      - name: The newest convocation's sittings first
        env:
          IN_CONVOCATION: ${{ inputs.convocation }}
          IN_SCHEDULED: ${{ inputs.scheduled }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install uv==0.13.9 && uv sync --frozen
          current=$(uv run python -c 'from zailiprotiv.config import CURRENT; print(CURRENT)')
          newest=$(uv run python -c 'from zailiprotiv.config import NEWEST; print(NEWEST)')
          conv="${IN_CONVOCATION}"; { [ -z "$conv" ] || [ "$conv" = "tekući" ] || [ "$IN_SCHEDULED" = "true" ]; } && conv=$current
          [ "$conv" = "$current" ] || exit 0  # an earlier one asked for by hand
          uv run zailiprotiv --convocation "$newest" index --tell "$RUNNER_TEMP/sednice" > "$RUNNER_TEMP/index.log" || { cat "$RUNNER_TEMP/index.log"; rm "$RUNNER_TEMP/index.log"; exit 0; }
          cat "$RUNNER_TEMP/index.log"
          # A sitting newly listed, or its day or agenda: the maintainer is told at once, one issue a sitting
          # (25 Nov 2026, "čim se objavi"); it stops nothing.
          for f in "$RUNNER_TEMP"/sednice/*.txt; do
            [ -f "$f" ] || continue
            title=$(head -n 1 "$f"); tail -n +2 "$f" > "$RUNNER_TEMP/telo.md"
            n=$(gh issue list --state all --limit 200 --json number,title | TITLE="$title" python3 -c 'import json,os,sys; print(next((r["number"] for r in json.load(sys.stdin) if r["title"] == os.environ["TITLE"]), ""))') || n=
            if [ -n "$n" ]; then gh issue comment "$n" --body-file "$RUNNER_TEMP/telo.md" || true
            else gh issue create --title "$title" --body-file "$RUNNER_TEMP/telo.md" || true; fi
          done
          git diff -I'"fetched": "[^"]*"' -- "data/$newest/index.json" | grep -q '^@@' || exit 0
          git add "data/$newest/index.json"
          # Not sent: the last step tries once more, and is red if it can't.
          if sh tools/predaj.sh "The sittings as the Assembly lists them (convocation $newest)"; then gh workflow run pages.yml --ref main || true; fi
      # The roll calls before all else, with their own commit. The recordings of a sitting's day, which take over an hour
      # on its evening (25 Nov 2026, measured: 59 to 97 minutes), are placed by **snimci**, started at the end.
      - name: The roll calls, the laws and the bills
        env:
          IN_CONVOCATION: ${{ inputs.convocation }}
          IN_SCHEDULED: ${{ inputs.scheduled }}
          IN_AGAIN_FLAG: ${{ inputs.again && '--again' || '' }}
          IN_REREAD: ${{ inputs.reread }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn >/dev/null  # tesseract: scanned bills
          current=$(uv run python -c 'from zailiprotiv.config import CURRENT; print(CURRENT)')
          conv="${IN_CONVOCATION}"; { [ -z "$conv" ] || [ "$conv" = "tekući" ] || [ "$IN_SCHEDULED" = "true" ]; } && conv=$current
          newest=$(uv run python -c 'from zailiprotiv.config import NEWEST; print(NEWEST)')
          # What the steps after this one work on. The newest only beside the current one, however that was named: the
          # clock's runs name it by number (19 Nov 2026: for that the newer convocation's MPs, their occupations and its
          # recordings went unread for a day).
          beside=; [ "$conv" = "$current" ] && [ "$newest" != "$conv" ] && beside=$newest
          { echo "CONV=$conv"; echo "CURRENT=$current"; echo "BESIDE=$beside"; echo "START=$(git rev-parse HEAD)"; } >> "$GITHUB_ENV"
          # A newer convocation with no law yet is read beside the current one; with its first law it becomes the
          # current one (config.CURRENT). Its sittings were read above. Each command by itself: the page of laws is empty
          # until the first one, `laws` says so with a 1, and for that its roll calls went unread from 17 to 25 Nov 2026.
          if [ -n "$beside" ]; then
            for what in laws votes link; do
              uv run zailiprotiv --convocation "$beside" "$what" || echo "::notice::$what of convocation $beside gave an error, or nothing"
            done
          fi
          c="--convocation $conv"
          # The newest, once it is the current one, was read in the step above: not asked for twice.
          if [ "$newest" = "$conv" ] && [ -f "$RUNNER_TEMP/index.log" ]; then cp "$RUNNER_TEMP/index.log" index.log
          else uv run zailiprotiv $c index | tee index.log; fi
          uv run zailiprotiv $c laws
          uv run zailiprotiv $c votes ${IN_AGAIN_FLAG} --reread "${IN_REREAD}"
          uv run zailiprotiv $c link
          # The bills in procedure are the current convocation's only; `bills` reads them too.
          if [ "$conv" = "$current" ]; then uv run zailiprotiv $c procedure; fi
          uv run zailiprotiv $c bills
      - name: Commit the roll calls
        if: always()  # keep what was read even when a later command failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data
          # Nothing new but the time of reading: left for the run's last commit.
          if ! git diff --cached -I'"fetched": "[^"]*"' -- data | grep -q '^@@'; then git reset -q -- data; exit 0; fi
          echo "ROLLS=1" >> "$GITHUB_ENV"  # the chain at the end starts for these too
          sh tools/predaj.sh "Roll calls read from the Assembly's site (convocation $CONV)"  # red if not sent; the last step tries once more
          gh workflow run pages.yml --ref main || true
      # A roll call the Assembly lists and no file here has is said aloud, whatever kept it from being read: an issue,
      # one while it is open (25 Nov 2026: five of the Fifteenth's unread for a week, every run green).
      - name: Every roll call listed is read
        if: ${{ !cancelled() && env.CURRENT != '' && env.CONV == env.CURRENT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/nije.md"
          for n in $CONV $BESIDE; do uv run zailiprotiv --convocation "$n" unread >> "$RUNNER_TEMP/nije.md"; done
          [ -s "$RUNNER_TEMP/nije.md" ] || exit 0
          while read -r line; do echo "::warning::listed, not read: $line"; done < "$RUNNER_TEMP/nije.md"
          title="Glasanja sa spiska Skupštine koja nisu pročitana"
          n=$(gh issue list --state open --limit 200 --json number,title | TITLE="$title" python3 -c 'import json,os,sys; print(next((r["number"] for r in json.load(sys.stdin) if r["title"] == os.environ["TITLE"]), ""))')
          [ -n "$n" ] || gh issue create --title "$title" --body-file "$RUNNER_TEMP/nije.md"
      - name: The recordings' list, the offices and the rest
        if: ${{ !cancelled() && env.CONV != '' }}  # also when the roll calls failed
        run: |
          c="--convocation $CONV"
          uv run zailiprotiv $c videos || true  # the sittings' recordings (videos.py); a broadcaster's hiccup stops nothing
          # Who holds which office (the Speaker, deputies, groups' chairs, committees, delegations) in the newest
          # convocation, and the Assembly's news, the relevant new ones named in the log (offices.py). The Rules of
          # Procedure once a day.
          if [ "$CONV" = "$CURRENT" ]; then
            uv run zailiprotiv photos || true
            uv run zailiprotiv poslovnik || true
            uv run zailiprotiv offices || echo "::warning::offices gave an error: nothing of this reading is kept"
          fi
          if [ -n "$BESIDE" ]; then
            uv run zailiprotiv --convocation "$BESIDE" videos || true
            uv run zailiprotiv members || true  # its MPs before its first roll call (members.py)
          fi
          uv run zailiprotiv uzivo-pull  # who spoke when, from the live page (live/); its computer may be off
      # A committee or delegation whose page gave fewer members than the Assembly lists (25 Nov 2026: names had become
      # links, and nobody of the Fifteenth's committees was read for a week): an issue, one while it is open.
      - name: Every body listed has its members
        if: ${{ !cancelled() && env.CURRENT != '' && env.CONV == env.CURRENT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run zailiprotiv offices --unread > "$RUNNER_TEMP/tela.md"
          [ -s "$RUNNER_TEMP/tela.md" ] || exit 0
          while read -r line; do echo "::warning::listed, not all its members read: $line"; done < "$RUNNER_TEMP/tela.md"
          title="Odbori i delegacije čiji članovi sa spiska Skupštine nisu svi pročitani"
          n=$(gh issue list --state open --limit 200 --json number,title | TITLE="$title" python3 -c 'import json,os,sys; print(next((r["number"] for r in json.load(sys.stdin) if r["title"] == os.environ["TITLE"]), ""))')
          [ -n "$n" ] || gh issue create --title "$title" --body-file "$RUNNER_TEMP/tela.md"
      - name: Commit the rest, and the chain
        if: always()  # keep what was read even when a later step failed
        env:
          CTX_EVENT_NAME: ${{ github.event_name }}
          IN_SCHEDULED: ${{ inputs.scheduled }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data
          c="$CONV"
          # The newest convocation, where the site is still on the one before it: its sittings' notes come after some
          # days, a day at a time, and the chain below asks only for $CONV's. Asked for three times a day, reading
          # again only a sitting with a new day's notes (24 Nov 2026: the notes of 19 Nov were up and nobody asked).
          newest=$(uv run python -c 'from zailiprotiv.config import NEWEST; print(NEWEST)')
          case "$(date -u +%H)" in 06|12|18)
            [ "$newest" = "$c" ] || gh workflow run transcripts.yml --ref main -f convocation="$newest" -f all=true -f more=true || true ;;
          esac
          # Next in the chain: the notes of the debates, then the model's writing, which publishes the site. The live
          # page's records alone (data/*/uzivo/) change every hour of a sitting: they are kept, and start nothing.
          if ! git diff --cached -I'"fetched": "[^"]*"' -- data ':(exclude)data/*/uzivo/**' | grep -q '^@@'; then
            if ! git diff --cached --quiet -- 'data/*/uzivo/**'; then
              git reset -q -- data && git add -- 'data/*/uzivo/**'  # the records only, not the times of reading
              sh tools/predaj.sh "Who spoke when, from the live page's records"
            fi
            sh tools/predaj.sh  # an earlier step's commit that was not sent
            # Nothing new but the time of reading: no commit. An hourly run stops here, unless it brought roll calls;
            # one by hand goes on.
            [ -z "$ROLLS" ] && { [ "${CTX_EVENT_NAME}" = "schedule" ] || [ "${IN_SCHEDULED}" = "true" ]; } && exit 0
            gh workflow run transcripts.yml --ref main -f convocation=$c; exit 0
          fi
          sh tools/predaj.sh "The recordings' list, offices and the rest, beside the roll calls (convocation $CONV)"
          gh workflow run pages.yml --ref main
          gh workflow run transcripts.yml --ref main -f convocation=$c
      # A recording not placed yet, or a day's record that has grown since this run began: **snimci** does the rest. After the
      # commit, so that it finds both on main. (A run that waits for another to end takes both too.)
      - name: The recordings, by a workflow of their own
        if: ${{ !cancelled() && env.CURRENT != '' && env.CONV == env.CURRENT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(for n in $CONV $BESIDE; do uv run zailiprotiv --convocation "$n" arhiva --waiting; done)
          [ -z "$waiting" ] && git diff --quiet "$START" HEAD -- 'data/*/uzivo/**' && exit 0
          echo "to be placed: ${waiting:-none; the record has grown}"
          gh workflow run snimci.yml --ref main
      # The Assembly lists a later convocation's sitting among the current one's: time to switch (docs/decisions/data.md,
      # "Changing convocation"). Said once, in an issue; the current convocation's data stay as they were.
      - name: Tell the maintainer a new convocation has begun
        if: always()
        env:
          CTX_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f index.log ] && grep -q "A later convocation's sitting is listed" index.log || exit 0
          title="Novi saziv na sajtu Skupštine: vreme za prebacivanje"
          [ -n "$(gh issue list -R "${CTX_REPOSITORY}" --state all --search "in:title \"$title\"" --json number -q '.[0].number')" ] && exit 0
          gh issue create -R "${CTX_REPOSITORY}" --title "$title" --body "$(printf 'Sajt Skupštine na spisku sednica ima sednicu novog saziva:\n\n%s\n\nPodaci tekućeg saziva su ostali kakvi su bili. Šta treba uraditi: AGENTS.md, „The Fifteenth convocation“.' "$(grep "A later convocation" index.log | sed 's/.*listed: /- /')")"
      - name: Tell the maintainer when this failed
        if: failure()
        env:
          CTX_WORKFLOW: ${{ github.workflow }}
          CTX_SERVER_URL: ${{ github.server_url }}
          CTX_REPOSITORY: ${{ github.repository }}
          CTX_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue per workflow, not one per failed run.
          title="Workflow ${CTX_WORKFLOW} ne prolazi"
          url="${CTX_SERVER_URL}/${CTX_REPOSITORY}/actions/runs/${CTX_RUN_ID}"
          n=$(gh issue list -R "${CTX_REPOSITORY}" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${CTX_REPOSITORY}" --body "Ponovo: $url"
          else gh issue create -R "${CTX_REPOSITORY}" --title "$title" --body "Pokretanje nije prošlo: $url"; fi
