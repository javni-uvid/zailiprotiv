# The stenographic notes as pages of their own, kept in a Cloudflare R2 bucket behind beleske.zailiprotiv.rs: too
# much for the site's host. Builds the pages from data/<N>/transcripts/ and sends only those that changed
# (data/notes_manifest.json remembers what is in the bucket). Runs after each transcripts run, and by hand.
# Needs the repository secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (an R2 API token for the bucket, object
# read and write) and CLOUDFLARE_ACCOUNT_ID.
name: notes

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Only say what would be sent"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: notes
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and send
        env:
          IN_DRY_FLAG: ${{ inputs.dry && '--dry' || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # for telling the cache what changed
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          pip install uv && uv sync --frozen
          uv run zailiprotiv notes-raw --pull  # the notes of every sitting; the repository holds only some
          uv run zailiprotiv notes-site --out _beleske
          # The search index of the notes, speech by speech (the Latin pages; the site's search page merges it with its own).
          npx -y pagefind@1.5.0 --site _beleske --glob "[0-9]*/**/*.html"
          uv run zailiprotiv notes-cors
          du -sh --apparent-size _beleske; find _beleske -type f | wc -l
          uv run zailiprotiv notes-upload --dir _beleske ${IN_DRY_FLAG}
      - name: Commit what is in the bucket
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notes_manifest.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Notes' pages sent to the bucket"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          if git status -sb | grep -q ahead; then exit 1; fi
          echo changed=1 >> "$GITHUB_OUTPUT"
      - name: Do the pages answer?
        if: ${{ !inputs.dry }}
        run: |
          # A page just sent can take a moment to show at the public address: three tries, a minute apart.
          for i in 1 2 3; do uv run zailiprotiv notes-check && exit 0; sleep 60; done; exit 1
      - name: Build the site again, so that it links to the new pages
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Tell the maintainer when this failed
        if: failure()
        env:
          CTX_WORKFLOW: ${{ github.workflow }}
          CTX_SERVER_URL: ${{ github.server_url }}
          CTX_REPOSITORY: ${{ github.repository }}
          CTX_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Workflow ${CTX_WORKFLOW} ne prolazi"
          url="${CTX_SERVER_URL}/${CTX_REPOSITORY}/actions/runs/${CTX_RUN_ID}"
          n=$(gh issue list -R "${CTX_REPOSITORY}" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${CTX_REPOSITORY}" --body "Ponovo: $url"
          else gh issue create -R "${CTX_REPOSITORY}" --title "$title" --body "Pokretanje nije prošlo: $url"; fi
