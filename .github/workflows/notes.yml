# The stenographic notes as pages of their own, kept in a Cloudflare R2 bucket behind beleske.zailiprotiv.rs: too
# much for the site's host. Builds the pages from data/<N>/transcripts/ and sends only those that changed
# (data/notes_manifest.json remembers what is in the bucket). Runs after each transcripts run, and by hand.
# Needs the repository secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (an R2 API token for the bucket, object
# read and write) and CLOUDFLARE_ACCOUNT_ID.
name: notes

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Only say what would be sent"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: notes
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PAGEFIND: pagefind@1.5.0
      PAGEFIND_GLOB: "[0-9]*/**/*.html"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}  # as it is when the run begins, not when it was asked for
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: build
        run: |
          pip install uv==0.13.9 && uv sync --frozen
          uv run zailiprotiv notes-raw --pull  # the notes of every sitting; the repository holds only some
          uv run zailiprotiv notes-site --out _beleske
          # What the search index is made of: every Latin page's bytes, and Pagefind's version and pattern. Pagefind
          # writes another index each time from the same pages (its files' names change), so with the same pages the
          # index of the run that had them is used again (the cache below, kept by this key alone): nothing to send.
          inputs=$( { echo "$PAGEFIND $PAGEFIND_GLOB"; cd _beleske && find . -path './[0-9]*' -name '*.html' -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -c1-64)
          echo "search=notes-pagefind-$inputs" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: search
        with:
          path: .cache/notes-pagefind
          key: ${{ steps.build.outputs.search }}
      - name: The search index
        env:
          HIT: ${{ steps.search.outputs.cache-hit }}
        run: |
          rm -rf _beleske/pagefind
          if [ "$HIT" = "true" ] && [ -f .cache/notes-pagefind/pagefind-entry.json ]; then
            cp -r .cache/notes-pagefind _beleske/pagefind
            echo "the pages are as when this index was made: used again"
          else
            # The search index of the notes, speech by speech (the Latin pages; the site's search page merges it with its own).
            npx -y "$PAGEFIND" --site _beleske --glob "$PAGEFIND_GLOB"
            rm -rf .cache/notes-pagefind && mkdir -p .cache && cp -r _beleske/pagefind .cache/notes-pagefind
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.search.outputs.cache-hit != 'true'
        with:
          path: .cache/notes-pagefind
          key: ${{ steps.build.outputs.search }}
      - name: Send
        env:
          IN_DRY_FLAG: ${{ inputs.dry && '--dry' || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # for telling the cache what changed
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          uv run zailiprotiv notes-cors
          du -sh --apparent-size _beleske; find _beleske -type f | wc -l
          uv run zailiprotiv notes-upload --dir _beleske ${IN_DRY_FLAG}
      - name: Commit what is in the bucket
        id: commit
        if: always()
        run: |
          git add data/notes_manifest.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          sh tools/predaj.sh "Notes' pages sent to the bucket"
          echo changed=1 >> "$GITHUB_OUTPUT"
      - name: Do the pages answer?
        if: ${{ !inputs.dry }}
        run: |
          # A page just sent can take a moment to show at the public address: three tries, a minute apart.
          for i in 1 2 3; do uv run zailiprotiv notes-check && exit 0; sleep 60; done; exit 1
      - name: Build the site again, so that it links to the new pages
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Tell the maintainer when this failed
        if: failure()
        env:
          CTX_WORKFLOW: ${{ github.workflow }}
          CTX_SERVER_URL: ${{ github.server_url }}
          CTX_REPOSITORY: ${{ github.repository }}
          CTX_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Workflow ${CTX_WORKFLOW} ne prolazi"
          url="${CTX_SERVER_URL}/${CTX_REPOSITORY}/actions/runs/${CTX_RUN_ID}"
          n=$(gh issue list -R "${CTX_REPOSITORY}" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${CTX_REPOSITORY}" --body "Ponovo: $url"
          else gh issue create -R "${CTX_REPOSITORY}" --title "$title" --body "Pokretanje nije prošlo: $url"; fi
