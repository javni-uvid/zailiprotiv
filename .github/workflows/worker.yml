# Publishes the counter of visitors' votes and the clock (worker/), and the worker in front of "Ko sada govori"
# (live/edge/: the site's page while the tunnel is down), to Cloudflare whenever they change, or by hand. Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers and D1, edit; Workers Routes on the zone, for live/edge), CLOUDFLARE_ACCOUNT_ID and
# DISPATCH_TOKEN (a GitHub token that may run this repository's Actions; the worker uses it to start the workflows).
name: worker

on:
  push:
    branches: [main]
    paths: ["worker/**", "live/edge/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the secrets
        id: ready
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then echo "::notice::CLOUDFLARE_API_TOKEN is not set: nothing published."; echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Make the table (once; does nothing when it exists)
        if: steps.ready.outputs.go == 'yes'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.152.0"  # the action's own default (3.x) doesn't know the rate limiter
          command: d1 execute zailiprotiv-glasovi --remote --file schema.sql
      - name: Publish
        if: steps.ready.outputs.go == 'yes'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.152.0"  # the action's own default (3.x) doesn't know the rate limiter
          command: deploy
          secrets: |
            DISPATCH_TOKEN
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      - name: Publish the worker in front of "Ko sada govori"
        if: steps.ready.outputs.go == 'yes'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: live/edge
          wranglerVersion: "4.152.0"
          command: deploy
