# Run by hand: add real roll-call PDFs (or bills, under tests/fixtures/bills) to tests/fixtures, so the parser can be tested where the site can't be
# reached. The PDFs are public records of MPs' votes.
name: fixtures

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "PDF addresses, one per line or separated by |"
        required: true
      folder:
        description: "Where under tests/fixtures: empty for roll calls, bills for bills"
        default: ""

permissions:
  contents: write

concurrency:
  group: fixtures
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download
        env:
          URLS: ${{ inputs.urls }}
        run: |
          pip install uv && uv sync --frozen
          python3 -c "import os; [print(u.strip()) for u in os.environ['URLS'].replace('|', chr(10)).splitlines() if u.strip()]" > urls.txt
          mapfile -t list < urls.txt
          uv run zailiprotiv download --to "tests/fixtures/${{ inputs.folder }}" "${list[@]}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures
          git diff --cached --quiet && exit 0
          git commit -m "PDFs for the tests"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
