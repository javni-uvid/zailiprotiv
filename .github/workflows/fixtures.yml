# Run by hand: add real roll-call PDFs (or bills, under tests/fixtures/bills) to tests/fixtures, so the parser can be tested where the site can't be
# reached. The PDFs are public records of MPs' votes.
name: fixtures

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "PDF addresses, one per line or separated by |"
        required: true
      folder:
        description: "Where under tests/fixtures: empty for roll calls, bills for bills"
        default: ""

permissions:
  contents: write

concurrency:
  group: fixtures
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}  # as it is when the run begins, not when it was asked for
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Download
        env:
          IN_FOLDER: ${{ inputs.folder }}
          URLS: ${{ inputs.urls }}
        run: |
          pip install uv==0.13.9 && uv sync --frozen
          python3 -c "import os; [print(u.strip()) for u in os.environ['URLS'].replace('|', chr(10)).splitlines() if u.strip()]" > urls.txt
          mapfile -t list < urls.txt
          uv run zailiprotiv download --to "tests/fixtures/${IN_FOLDER}" "${list[@]}"
      - name: Commit
        run: |
          git add tests/fixtures
          git diff --cached --quiet && exit 0
          sh tools/predaj.sh "PDFs for the tests"
