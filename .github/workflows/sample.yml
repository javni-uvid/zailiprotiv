# A sample of debate summaries written by another model, to compare its quality and cost with the published texts
# before changing the model. By hand only; run again to pick up a batch that was still running. The sample is kept
# as the run's artifact (two weeks), not in the repository: it is for looking at, not for publishing.
name: sample

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model"
        default: "claude-haiku-5-5"
      convocation:
        description: "Convocation"
        default: "13"
      only:
        description: "Bill files, comma-separated (names in data/<N>/debates/)"
        required: true
      wait:
        description: "Minutes to wait for the batch"
        default: "60"

permissions:
  contents: write
  id-token: write

concurrency:
  group: summaries  # one writer of data/batches.json at a time
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Write
        env:
          IN_CONVOCATION: ${{ inputs.convocation }}
          IN_ONLY: ${{ inputs.only }}
          IN_MODEL: ${{ inputs.model }}
          IN_WAIT: ${{ inputs.wait }}
          ZAILIPROTIV_MODEL: ${{ inputs.model }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          pip install uv==0.13.9 && uv sync --frozen
          uv run zailiprotiv --convocation "${IN_CONVOCATION}" debates-batch --only "${IN_ONLY}" \
            --out "samples/${IN_MODEL}/${IN_CONVOCATION}" --wait "${IN_WAIT}"
          uv run zailiprotiv status | grep -E "potrošeno|batch u toku" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: sample
          path: samples/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit
        if: always()
        env:
          IN_MODEL: ${{ inputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/batches.json  # what is still running, for the next run
          git diff --cached --quiet && exit 0
          git commit -m "A sample written by ${IN_MODEL}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
