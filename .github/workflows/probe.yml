# By hand: what is inside a few of the Assembly's bill PDFs whose memorandum our reader did not find? Text or scanned
# pages, how many pages, and what an OCR of the first pages gives. Reads only; changes nothing.
name: probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "PDF addresses, space-separated (empty: five bills in procedure without a memorandum)"
        default: ""

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn >/dev/null
      - name: Look
        run: |
          urls="${{ inputs.urls }}"
          [ -n "$urls" ] || urls=$(python3 - <<'PY'
          import json, glob
          d = json.load(open(sorted(glob.glob("data/*/procedure.json"))[-1]))
          import os
          seen, out = set(), []
          for pdf, b in sorted(d["bills"].items(), key=lambda x: x[1]["submitted"] or "", reverse=True):
              f = os.path.join(os.path.dirname(sorted(glob.glob("data/*/procedure.json"))[-1]), "bills", b.get("bill_file", ""))
              if b["last_seen"] == d["fetched"] and os.path.exists(f) and not json.load(open(f)).get("sections") and b["proposer"] not in seen:
                  seen.add(b["proposer"]); out.append(pdf)
          print(" ".join(out[:5]))
          PY
          )
          n=0
          for u in $urls; do
            n=$((n+1)); echo "=== $u"
            curl -sS -L --max-time 120 -A "Mozilla/5.0 (zailiprotiv.rs)" -o "$n.pdf" "$u" || { echo "no download"; continue; }
            ls -l "$n.pdf" | awk '{print "bytes", $5}'; file -b "$n.pdf" | cut -c1-60
            pdfinfo "$n.pdf" 2>&1 | grep -E "Pages|Producer|Creator" || true
            echo "text chars: $(pdftotext -layout "$n.pdf" - 2>/dev/null | wc -m)"
            pdftotext -layout "$n.pdf" - 2>/dev/null | grep -n -i -E "^\s*(I|II|III|IV|V|VI|[0-9]{1,2})\.?\s|образложењ|obrazlo|О Б Р А З" | head -25 || true
            echo "images: $(pdfimages -list "$n.pdf" 2>/dev/null | tail -n +3 | wc -l)"
            if [ "$(pdftotext "$n.pdf" - 2>/dev/null | wc -m)" -lt 500 ]; then
              pdftoppm -r 200 -f 1 -l 2 -png "$n.pdf" "p$n" && for p in p$n-*.png; do s=$(date +%s); tesseract "$p" - -l srp+srp_latn 2>/dev/null | head -25; echo "ocr secs $(( $(date +%s)-s ))"; done
            fi
          done
