# By hand: what do the sittings' pages of the convocations before 2008 link to? Roll calls, notes, or only an
# account in words. Reads the convocation's archive, its list of sittings and a few of the sittings' pages.
name: probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q uv && uv sync --frozen -q
          uv run python - <<'PY'
          import re, time, urllib.parse
          from zailiprotiv import skupstina
          from zailiprotiv.config import BASE
          def get(u):
              time.sleep(1.5)
              return skupstina.fetch(u).decode("utf-8", "replace")
          for name, url in (("2007", BASE + "/aktivnosti/narodna-skupstina/arhiva-aktivnosti/saziv-od-14-februara-2007.995.html"),
                            ("2004", BASE + "/aktivnosti/narodna-skupstina/arhiva-aktivnosti/saziv-od-27-januara-2004.996.html"),
                            ("2001", BASE + "/aktivnosti/narodna-skupstina/arhiva-aktivnosti/saziv-od-22-januara-2001.997.html")):
              print("==", name)
              try:
                  page = get(url)
                  sub = sorted(set(re.findall(r'href="([^"]*arhiva-aktivnosti/saziv-od-[^"/]*%s[^"]*/[^"]+)"' % name, page)))
                  print(" sub-pages:", [urllib.parse.unquote(s).rsplit("/", 1)[-1] for s in sub])
                  z = next((s for s in sub if "zasedanja" in s), None)
                  if not z:
                      continue
                  z = z if z.startswith("http") else BASE + z
                  found = skupstina.archive_sittings(z, lambda u: skupstina.fetch(u), 1.5)
                  print(" sittings:", len(found))
                  for s in found[:3] + found[len(found)//2:len(found)//2+2] + found[-2:]:
                      body = get(s.url)
                      main = body.split('id="content"')[-1] if 'id="content"' in body else body
                      files = sorted(set(re.findall(r'href="([^"]+\.(?:pdf|docx?|rtf|zip|xlsx?))"', body, flags=re.I)))
                      print("  ", s.title[:70], "|", s.url.rsplit("/", 1)[-1], "| files:", len(files), [urllib.parse.unquote(f)[-70:] for f in files[:4]],
                            "| glasanj" , len(re.findall(r"(?i)гласањ|glasanj", main)), "| стеног", len(re.findall(r"(?i)стенограф|stenograf", main)))
              except Exception as e:
                  print(" failed:", type(e).__name__, e)
          # the laws' pages: what does a law link to?
          for name, url in (("2007", BASE + "/akti/doneti-zakoni/u-sazivu-od-14-februara-2007-.1034.html"),
                            ("2004", BASE + "/akti/doneti-zakoni/u-sazivu-od-27-januara-2004.1035.html"),
                            ("2001", BASE + "/akti/doneti-zakoni/u-sazivu-od-22-januara-2001.1036.html")):
              try:
                  page = get(url)
                  files = re.findall(r'href="([^"]+\.(?:pdf|docx?|rtf|zip))"', page, flags=re.I)
                  print("== laws", name, "| files on the first page:", len(files), [urllib.parse.unquote(f)[-60:] for f in files[:3]])
              except Exception as e:
                  print("== laws", name, "failed:", e)
          PY
