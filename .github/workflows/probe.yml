# Run by hand: can GitHub's runners reach parlament.gov.rs, and which pages list the roll-call PDFs?
# Changes nothing in the repository; the PDFs found, the pages listing them and a few samples are saved as an artifact.
name: probe

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Page to start the walk from"
        default: "https://www.parlament.gov.rs/активности/народна-скупштина/заседања/ванредна.35.html"
      max_pages:
        description: "Pages to read at most"
        default: "200"

permissions:
  contents: read

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe the Assembly's site
        run: |
          pip install uv && uv sync --frozen
          uv run zailiprotiv probe --start "${{ inputs.start }}" --max-pages "${{ inputs.max_pages }}" --out probe
      - name: Text of the sample PDFs
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          for f in probe/*.pdf; do [ -f "$f" ] && pdftotext -layout "$f" "${f%.pdf}.txt" || true; done
          ls -la probe || true
      - name: Show what the probe found
        if: always()
        # The artifact can't always be downloaded where the work is reviewed, so the log carries the essentials.
        # Roll-call PDFs are public records of MPs' votes; their names may appear here.
        run: |
          echo "== pages read"; python3 -c "import sys,urllib.parse; [print(urllib.parse.unquote(l.strip())) for l in open('probe/visited.txt')]" || true
          echo "== known PDF as text (first 120 lines)"; head -n 120 probe/known.txt || true
          echo "== sample PDFs (first 60 lines each)"; for f in probe/sample-*.txt; do [ -f "$f" ] && { echo "-- $f"; head -n 60 "$f"; }; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/
          retention-days: 7
