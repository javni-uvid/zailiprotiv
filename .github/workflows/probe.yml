# By hand: what is inside a few of the Assembly's bill PDFs whose memorandum our reader did not find? Text or scanned
# pages, how many pages, and what an OCR of the first pages gives. Reads only; changes nothing.
name: probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "PDF addresses, space-separated (empty: five bills in procedure without a memorandum)"
        default: ""

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn >/dev/null && pip install -q uv==0.13.9 && uv sync --frozen -q
      - name: Look
        env:
          IN_URLS: ${{ inputs.urls }}
        run: |
          urls="${IN_URLS}"
          [ -n "$urls" ] || urls=$(python3 - <<'PY'
          import json, glob
          d = json.load(open(sorted(glob.glob("data/*/procedure.json"))[-1]))
          import os
          seen, out = set(), []
          for pdf, b in sorted(d["bills"].items(), key=lambda x: x[1]["submitted"] or "", reverse=True):
              f = os.path.join(os.path.dirname(sorted(glob.glob("data/*/procedure.json"))[-1]), "bills", b.get("bill_file", ""))
              if b["last_seen"] == d["fetched"] and os.path.exists(f) and not json.load(open(f)).get("sections") and b["proposer"] not in seen:
                  seen.add(b["proposer"]); out.append(pdf)
          print(" ".join(out[:12]))
          PY
          )
          n=0
          for u in $urls; do
            n=$((n+1)); echo "=== $u"
            curl -sS -L --max-time 120 -A "Mozilla/5.0 (zailiprotiv.rs)" -o "$n.pdf" "$u" || { echo "no download"; continue; }
            pdfinfo "$n.pdf" 2>&1 | grep -E "Pages" || true
            s=$(date +%s)
            uv run python - "$n.pdf" <<'PY'
          import sys, re
          from zailiprotiv import bills
          text = bills.text_of(sys.argv[1])
          scan = len("".join(text.split())) < 400
          if scan:
              text = bills.ocr_of(sys.argv[1])
          memo = bills.memorandum(text)
          print("scan" if scan else "text", len(text), "chars; sections:", {k: len(v) for k, v in memo.sections.items()}, "articles:", memo.articles)
          if not memo.sections:
              for l in text.splitlines():
                  t = l.strip()
                  caps = sum(c.isupper() for c in t) / max(1, sum(c.isalpha() for c in t))
                  if 6 < len(t) < 90 and (re.search(r"(?i)основ|разлоз|образл|објашњ|osnov|razloz|obrazl|средств|sredstv", t) and caps > 0.5 or caps > 0.8):
                      print("   |", l.strip())
          else:
              print("   reasons:", memo.sections.get("reasons", "")[:300].replace("\n", " "))
          PY
            echo "secs $(( $(date +%s)-s ))"
          done
