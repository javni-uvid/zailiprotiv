# Build the site and publish it on GitHub Pages (zailiprotiv.rs). Runs on every push to main, and when a data run
# starts it (a push by the workflows' own token starts no other workflow).
name: pages

on:
  push:
    branches: [main]
    # A build takes about nine minutes; a change that cannot alter the site starts none.
    paths: ["**", "!tests/**", "!worker/**", "!**.md", "!.github/workflows/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A build takes several minutes (the search index); with pushes minutes apart a cancelled build meant nothing was
  # published for half an hour. A running build finishes, and only the newest of those waiting runs after it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4  # the share pictures, drawn once each
        with:
          path: .cache
          key: og-${{ github.run_id }}
          restore-keys: og-
      - name: Build
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # for telling the cache what changed
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          pip install uv && uv sync --frozen
          uv run zailiprotiv site --out _site --domain zailiprotiv.rs
          # Downloads and share pictures live in a bucket (files_url in data/settings.json; see files_site). They are
          # there before the pages that link to them are published; a failed upload stops the build.
          uv run zailiprotiv files-split --site _site --out _podaci
          uv run zailiprotiv files-upload --dir _podaci --bucket "${{ vars.R2_FILES_BUCKET || 'zailiprotiv-podaci' }}"
          # The search index of the whole text (Pagefind; made of the pages, served from the site itself).
          npx -y pagefind@1.3.0 --site _site | tail -8
          du -sh --apparent-size _site; find _site -type f | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # The site stands behind Cloudflare, which may keep its pages (a cache rule, the maintainer's): told after each
      # publishing to forget them, so the new ones are served at once. Without the token or the zone's id: skipped.
      - name: Tell the cache the site changed
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then echo "::notice::cache not purged: no token or zone id"; exit 0; fi
          for i in 1 2 3; do
            got=$(curl -sS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data '{"hosts":["zailiprotiv.rs","www.zailiprotiv.rs"]}' | head -c 300) || true
            case "$got" in *'"success":true'*) echo "cache purged: zailiprotiv.rs"; exit 0;; esac
            sleep 10
          done
          echo "::warning::cache not purged: $got"; exit 1
