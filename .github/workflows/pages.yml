# Build the site and publish it on GitHub Pages (zailiprotiv.rs). Runs on every push to main, and when a data run
# starts it (a push by the workflows' own token starts no other workflow).
name: pages

on:
  push:
    branches: [main]
    # A build takes about seven minutes (a change only to static/, about two: the fast path below); a change that
    # cannot alter the site starts none.
    paths: ["**", "!tests/**", "!worker/**", "!live/**", "!**.md", "!.github/workflows/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "Tell IndexNow about every page, not only those that changed (after it first refused, say)"
        type: boolean
        default: false

permissions: {}  # each job asks for what it needs

concurrency:
  group: pages
  # A build takes several minutes (the search index); with pushes minutes apart a cancelled build meant nothing was
  # published for half an hour. A running build finishes, and only the newest of those waiting runs after it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # the fast path: the last published site, from the run that published it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # to see what changed since the commit of the site now published
      # The fast path (18 Nov 2026): a push that changes only static/ (styles, scripts, fonts, icons) needs no new
      # build of seven minutes. The site the last successful run published is taken from that run and static/ is put
      # into it (zailiprotiv static-patch; the same pages a full build would make, checked by building both). Any
      # other change, a run started by hand, or that site not found: the full build.
      - name: What changed since the site now published
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          IN_EVENT: ${{ github.event_name }}
        run: |
          fast=false
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w pages -s success -b main -L 1 --json headSha,databaseId \
                 -q '.[0] | "\(.headSha) \(.databaseId)"' 2>/dev/null || true)
          sha=${last% *}; run=${last#* }
          if [ "$IN_EVENT" = push ] && [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$sha" HEAD)
            # What can't alter the site is left out (as the push filter above); pages.yml itself means a full build.
            other=$(printf '%s\n' "$changed" \
                    | grep -vE '^$|^(src/zailiprotiv/static/|tests/|worker/|live/|\.github/workflows/)|\.md$' || true)
            if printf '%s\n' "$changed" | grep -qx '.github/workflows/pages.yml'; then other=pages.yml; fi
            echo "changed: $(printf '%s\n' "$changed" | wc -l) files; others than static/: ${other:-none}" | head -c 600
            if [ -z "$other" ] && printf '%s\n' "$changed" | grep -q '^src/zailiprotiv/static/'; then
              if gh run download "$run" -R "$GITHUB_REPOSITORY" -n github-pages -D _published 2>/dev/null \
                 && mkdir -p _site && tar -xf _published/artifact.tar -C _site; then
                fast=true
              else
                echo "::notice::the published site of run $run is not there (kept 7 days): full build"
              fi
            fi
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "since $sha (run $run): fast path $fast"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0; the share pictures, drawn once each
        with:
          path: .cache
          key: og-${{ github.run_id }}
          restore-keys: og-
      - name: Patch styles and scripts into the published site
        if: steps.changes.outputs.fast == 'true'
        run: |
          pip install uv==0.13.9 && uv sync --frozen
          uv run zailiprotiv static-patch --site _site
          : > indexnow.txt  # the pages' text is as it was: nothing to tell search engines
      - name: Build
        if: steps.changes.outputs.fast != 'true'
        env:
          CTX_R2_FILES_BUCKET_OR: ${{ vars.R2_FILES_BUCKET || 'zailiprotiv-podaci' }}
          IN_INDEXNOW_ALL_FLAG: ${{ inputs.indexnow_all && '--all' || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # for telling the cache what changed
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          pip install uv==0.13.9 && uv sync --frozen
          uv run zailiprotiv notes-raw --pull  # the notes of every sitting; the repository holds only some
          uv run zailiprotiv site --out _site --domain zailiprotiv.rs
          # Downloads and share pictures live in a bucket (files_url in data/settings.json; see files_site). They are
          # there before the pages that link to them are published; a failed upload stops the build.
          uv run zailiprotiv files-split --site _site --out _podaci
          uv run zailiprotiv files-upload --dir _podaci --bucket "${CTX_R2_FILES_BUCKET_OR}"
          # The search index of the whole text (Pagefind; made of the pages, served from the site itself).
          # The Latin pages only: the Cyrillic twins (cir/) say the same and their text is not indexed, but reading
          # them took Pagefind more than half of its five minutes.
          npx -y pagefind@1.5.0 --site _site --glob "{*.html,{zakon,poslanik,grupa,sednica,nedelja,predlog,oblast,kviz}/**/*.html}" | tail -8
          uv run zailiprotiv lighten --site _site  # after the search: without the cells' end tags it runs words together
          du -sh --apparent-size _site; find _site -type f | wc -l
          # GitHub Pages publishes no site over 1 GB: said while there is still time (docs/decisions/code.md)
          bytes=$(du -sb _site | cut -f1)
          if [ "$bytes" -gt 850000000 ]; then echo "::warning::the site is $((bytes / 1000000)) MB of GitHub Pages' 1000"; fi
          # The pages whose text changed since the last build, for search engines (told after publishing).
          python3 tools/indexnow.py list _site .cache/indexnow.json indexnow.txt ${IN_INDEXNOW_ALL_FLAG}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
          retention-days: 7  # the fast path takes the published site from here
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: indexnow
          path: indexnow.txt
          retention-days: 2
  deploy:
    needs: build
    permissions:
      contents: read    # the tools for telling search engines
      pages: write      # publish
      id-token: write   # prove the publishing is this repository's
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      # The site stands behind Cloudflare, which may keep its pages (a cache rule, the maintainer's): told after each
      # publishing to forget them, so the new ones are served at once. Without the token or the zone's id: skipped.
      - name: Tell the cache the site changed
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then echo "::notice::cache not purged: no token or zone id"; exit 0; fi
          for i in 1 2 3; do
            got=$(curl -sS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data '{"hosts":["zailiprotiv.rs","www.zailiprotiv.rs"]}' | head -c 300) || true
            case "$got" in *'"success":true'*) echo "cache purged: zailiprotiv.rs"; exit 0;; esac
            sleep 10
          done
          echo "::warning::cache not purged: $got"; exit 1
      # Search engines that take IndexNow (Bing and others) are told which pages changed. A failure here is only noted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            data/settings.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: indexnow
      - name: Tell search engines what changed
        continue-on-error: true
        run: python3 tools/indexnow.py send indexnow.txt
