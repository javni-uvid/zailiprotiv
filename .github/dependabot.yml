# Dependabot: once a month, one pull request for the workflows' actions (pinned to commits; it moves the pins and
# their version comments) and one for the Python packages (uv.lock). Security fixes come as soon as they are known.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The live service's image: its base images (named by digest in live/Dockerfile and docker-compose.yml) and the
  # packages' exact versions (live/constraints.txt).
  - package-ecosystem: docker
    directory: /live
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
    ignore:  # the image's Python moves when that is decided and tried, not by itself (its first pull request asked for 3.15)
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /live
    schedule:
      interval: monthly
    groups:
      compose:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /live
    schedule:
      interval: monthly
    groups:
      live:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
