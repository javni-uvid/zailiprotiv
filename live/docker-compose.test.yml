# The test: the working tree built and run beside the live service and apart from it. It reads the same broadcast but
# keeps its own data, counts no visits, sends no notifications and has no tunnel. mikrofon.ps1 sets the names: from the
# main clone on main, mikrofon:test at http://127.0.0.1:8001/; from a worktree, mikrofon:test-<branch> on a port of
# its own, so that agents' tests never replace each other's, nor the one `uzivo` puts live (20 Nov 2026).
name: ${TEST_PROJEKAT:-mikrofon-test}
services:
  uzivo:
    image: ${TEST_IMAGE:-mikrofon:test}
    build:
      context: ..
      dockerfile: live/Dockerfile
      args:
        VERZIJA: ${VERZIJA:-}
        GRANA: ${GRANA:-}
        CISTO: ${CISTO:-}
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the computer itself, where Whisper's server on the graphics card runs
    environment:
      PUBLIC_URL: http://127.0.0.1:${TEST_PORT:-8001}/
      ANALYTICS_TOKEN: ""         # the test's visits are not the site's
      PUSH_TOKEN: ""              # the test never sends the notifications
      ANTHROPIC_API_KEY: "${TEST_ANTHROPIC_API_KEY:-}"  # the test asks the model only when told to (mikrofon.ps1 test with the key)
      # Nothing the live service alone may do: the readers' addresses and the maintainer's mail, and the bucket its
      # listeners hear (a test once had its keys, and would have written over the live playlist). A new secret of the
      # service is emptied here too (a test asks for it).
      MEJL_KLJUC: ""
      MEJL_UREDNIK: ""
      ZVUK_R2_ENDPOINT: ""
      ZVUK_R2_BUCKET: ""
      ZVUK_R2_KLJUC: ""
      ZVUK_R2_TAJNA: ""
      ZVUK_URL: ""                # the test's listeners hear its own playlist (/slusaj/z.m3u8)
      WHISPER_THREADS: "4"        # leaves the live service its cores
      WHISPER_URL: "${WHISPER_URL-http://host.docker.internal:8178}"  # the same server as the live service (it is fast enough for both)
    volumes:
      - podaci:/data
      - whisper:/data/hf          # the live service's model, not fetched again
    security_opt:
      - no-new-privileges:true    # nothing in it can become root again
    cap_drop: [ALL]
    # What the entry needs to hand /data over and become the user (ulaz.sh); DAC_OVERRIDE so that an image from
    # before 20 Nov 2026, which runs as root, can still write there when `vrati` puts it back. The service's own
    # process has none of them: it isn't root, and can't become it.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    ports:
      - "127.0.0.1:${TEST_PORT:-8001}:8000"

volumes:
  podaci:
    name: ${TEST_PODACI:-mikrofon-test-podaci}
  whisper:
    name: mikrofon-whisper
    external: true                # made once by mikrofon.ps1, shared by the live service and every test
