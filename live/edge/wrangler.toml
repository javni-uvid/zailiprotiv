# In front of "Ko sada govori" (live/): passes everything to the tunnel, and while the tunnel is down (Cloudflare's
# 530, the maintainer's computer off) shows the site's page for that instead (zailiprotiv.rs/mikrofon). Published by
# the worker workflow with the counter.
name = "zailiprotiv-mikrofon"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = false
# Only the pages and the JSON: not /deo, which an open page asks for every few seconds (18 Nov 2026: through the
# worker, a sitting's viewers spent the free plan's 100,000 requests a day, and Cloudflare answered 429, the counter
# of votes included, as the limit is the account's). While the tunnel is down /deo gets Cloudflare's 530, and the
# page keeps what it shows. A pattern without "*" is that path only.
routes = [
  { pattern = "mikrofon.zailiprotiv.rs/", zone_name = "zailiprotiv.rs" },
  { pattern = "mikrofon.zailiprotiv.rs/cir", zone_name = "zailiprotiv.rs" },
  { pattern = "mikrofon.zailiprotiv.rs/cir/", zone_name = "zailiprotiv.rs" },
  { pattern = "mikrofon.zailiprotiv.rs/stanje.json", zone_name = "zailiprotiv.rs" },
  { pattern = "mikrofon.zailiprotiv.rs/dani.json", zone_name = "zailiprotiv.rs" },
  { pattern = "mikrofon.zailiprotiv.rs/dan/*", zone_name = "zailiprotiv.rs" },
  # A shared speech (25 Nov 2026). A pattern has no digits and takes "*" at its end only, so the worker checks the ten
  # digits (SHARED); anything else under it goes to the service as it is. With "*", an address with a query matches too.
  { pattern = "mikrofon.zailiprotiv.rs/govor/*", zone_name = "zailiprotiv.rs" },
  { pattern = "mikrofon.zailiprotiv.rs/cir/govor/*", zone_name = "zailiprotiv.rs" },
  # The same speech from a mail (25 Nov 2026): while the service is off the worker itself leads on to it.
  { pattern = "mikrofon.zailiprotiv.rs/iz-mejla/*", zone_name = "zailiprotiv.rs" },
  { pattern = "mikrofon.zailiprotiv.rs/cir/iz-mejla/*", zone_name = "zailiprotiv.rs" },
]
# Not /stanje.js either: other pages read it every few seconds, from Cloudflare's cache (live/uzivo/main.py).
