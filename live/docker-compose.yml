# The live service at mikrofon.zailiprotiv.rs. It runs the image the test passed (mikrofon:uzivo) and never builds:
# a change is built and tried with docker-compose.test.yml first, then promoted (mikrofon.ps1 uzivo).
name: mikrofon
services:
  uzivo:
    image: mikrofon:uzivo
    pull_policy: never
    env_file: .env
    volumes:
      - podaci:/data              # today's turns and the last list of MPs, kept across restarts
      - whisper:/data/hf          # Whisper's model, shared with the test
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  tunel:                          # Cloudflare's named tunnel: mikrofon.zailiprotiv.rs → http://uzivo:8000
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file: .tunnel.env         # TUNNEL_TOKEN=… (from Cloudflare; never committed)
    depends_on:
      - uzivo
    restart: unless-stopped

volumes:
  podaci:
    name: mikrofon-podaci
  whisper:
    name: mikrofon-whisper
