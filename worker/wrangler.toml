name = "zailiprotiv-glasovi"
main = "worker.js"
compatibility_date = "2026-06-01"
# The counter's own address on the site's domain (its DNS is at Cloudflare since 13 Nov 2026); the deploy makes the
# DNS record and the certificate. The workers.dev address stays on for pages still cached with it.
routes = [{ pattern = "glasovi.zailiprotiv.rs", custom_domain = true }]
workers_dev = true  # with routes set, the workers.dev address is off unless asked for

[[d1_databases]]
binding = "DB"
database_name = "zailiprotiv-glasovi"
database_id = "744f1fb2-1e47-4536-b6eb-083518062d14"

# A few sends an hour from one address. If `wrangler deploy` rejects this block, delete it: the worker runs without.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# A vote on one law, or a quote marked, from a law's page: more often than the quiz, which sends ten at once.
[[ratelimits]]
name = "VLIMIT"
namespace_id = "1002"
simple = { limit = 40, period = 60 }

# The day's summary by mail (Cloudflare Email Service, Workers Paid; 23 Nov 2026): only from the live page's address.
[[send_email]]
name = "MEJL"
allowed_sender_addresses = ["sazetak@mikrofon.zailiprotiv.rs"]

[vars]
# The public half of the maintainer's key (P-256): sign-ups are sealed with it (mejl.js); the private half is
# MEJL_KLJUC in live/.env only, so that what this worker keeps can be read on the maintainer's computer alone.
MEJL_JAVNI = '{"kty":"EC","crv":"P-256","x":"yoZ3BrUkPZPWbBDHw0Y7xJGBNBD19d3qZLpc9hSaMnU","y":"aV852Ye9oBE-b0i_cOQ0Ve-MmOgSLALolCiyPkOXnM0"}'

# The clock GitHub's own schedule didn't keep (13 Nov 2026): every hour of the working day the worker starts the
# votes workflow (reading the Assembly's site), and every six hours the model's writing. Times in UTC.
[triggers]
# And every five minutes of a weekday's working hours, the watch over "Ko sada govori" (worker.js, watch).
crons = ["47 5-21 * * *", "53 */6 * * *", "*/5 6-19 * * 1-5"]
