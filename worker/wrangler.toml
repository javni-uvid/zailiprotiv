name = "zailiprotiv-glasovi"
main = "worker.js"
compatibility_date = "2026-06-01"
# The counter's own address on the site's domain (its DNS is at Cloudflare since 13 Nov 2026); the deploy makes the
# DNS record and the certificate. The workers.dev address keeps working.
routes = [{ pattern = "glasovi.zailiprotiv.rs", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "zailiprotiv-glasovi"
database_id = "744f1fb2-1e47-4536-b6eb-083518062d14"

# A few sends an hour from one address. If `wrangler deploy` rejects this block, delete it: the worker runs without.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# The clock GitHub's own schedule didn't keep (13 Nov 2026): every hour of the working day the worker starts the
# votes workflow (reading the Assembly's site), and every six hours the model's writing. Times in UTC.
[triggers]
crons = ["47 5-21 * * *", "53 */6 * * *"]
